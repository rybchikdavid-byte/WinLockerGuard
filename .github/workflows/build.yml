name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw 'csc.exe not found' }
          $sources = @(Get-ChildItem -Path . -Filter *.cs | Sort-Object Name | ForEach-Object { $_.Name })
          $cscArgs = @('/nologo','/target:winexe','/optimize+','/codepage:65001','/out:WinLockerGuard.exe','/r:System.dll','/r:System.Core.dll','/r:System.Drawing.dll','/r:System.Windows.Forms.dll','/r:Microsoft.CSharp.dll')
          $cscArgs += $sources
          & $csc $cscArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WinLockerGuard-exe
          path: WinLockerGuard.exe
          if-no-files-found: error
